<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="870" viewBox="0 0 1000 870">
<title>Slateford Quarry outdoor redesign</title>
<desc>Four proposed outdoor maps form a clockwise first-visit route and a power-gated return loop. Arrival yard leads to working terraces, then pump basin; the old haul terrace connects back after power restoration. This is a layout schematic, not a collision render.</desc>
<defs>
  <pattern id="stone" width="32" height="24" patternUnits="userSpaceOnUse"><rect width="32" height="24" fill="#737b7d"/><path d="M0 22H32M18 0V10H32M0 10H10V22" fill="none" stroke="#656d70" stroke-width="1"/></pattern>
  <pattern id="sump" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#527d80"/><path d="M2 5H11M10 15H18" stroke="#8db8b3" stroke-width="1"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#e9c67b"/></marker>
  <g id="atlas"><image width="128" height="128" href="data:image/png;base64," image-rendering="pixelated"/></g>
  <g id="gate"><rect x="-16" y="-5" width="32" height="10" rx="2" fill="#b2584a" stroke="#f5ddaf" stroke-width="2"/><path d="M-8-4L-2 4M2-4L8 4" stroke="#f5ddaf" stroke-width="2"/></g>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#293841}.title{font-size:32px;font-weight:600}.subtitle{font-size:16px;fill:#617077}.zone{font-size:20px;font-weight:600;fill:#fff0cf}.note{font-size:14px;fill:#f8efdc}.small{font-size:13px;fill:#617077}.label{font-size:15px;font-weight:600}.path{fill:none;stroke:#d5bb8e;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}.loop{fill:none;stroke:#a8c6b0;stroke-width:13;stroke-linejoin:round}.seam{fill:none;stroke:#65767c;stroke-width:3;stroke-dasharray:4 5}.cliff{fill:none;stroke:#4c565c;stroke-width:13;stroke-linejoin:round}.ledge{fill:none;stroke:#b1b7a8;stroke-width:3}.zonebox{fill:url(#stone);stroke:#4c565c;stroke-width:3}.pin{fill:#e9c67b;stroke:#3c4850;stroke-width:2}</style>
<rect width="1000" height="870" fill="#f4f0e6"/>
